name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "", archive: tar.gz }
          - { goos: linux, goarch: arm64, ext: "", archive: tar.gz }
          - { goos: darwin, goarch: amd64, ext: "", archive: tar.gz }
          - { goos: darwin, goarch: arm64, ext: "", archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: .exe, archive: zip }
          - { goos: windows, goarch: arm64, ext: .exe, archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test
        run: go test -buildvcs=false ./cmd/... ./internal/...
      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          EXT: ${{ matrix.ext }}
          ARCHIVE_TYPE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="beeapi_${GOOS}_${GOARCH}"
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${VERSION}" -o "dist/beeapi${EXT}" ./cmd/beeapi
          if [ "$ARCHIVE_TYPE" = "zip" ]; then
            (cd dist && zip "${asset}.zip" "beeapi${EXT}")
            package="dist/${asset}.zip"
          else
            tar -C dist -czf "dist/${asset}.tar.gz" beeapi
            package="dist/${asset}.tar.gz"
          fi
          sha256sum "$package" | awk '{print $1}' > "$package.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: beeapi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/beeapi_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
            dist/beeapi_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
